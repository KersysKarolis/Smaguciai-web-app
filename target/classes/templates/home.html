<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org", charset="UTF-8">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Home</title>
    <link rel ="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/components/program.css}">
    <link rel="stylesheet" th:href="@{/css/components/personage.css}">
</head>
<body class="home-layout">
<div th:replace="fragments/hero::hero"></div>
<div th:replace="fragments/navigation::navigation"></div>
<div th:replace="fragments/about::about"></div>
<div th:replace="fragments/program::program"></div>
<div th:replace="fragments/personage::personage"></div>
<!-- antras header laukas po pakeitimu ->
<header class="hero">
    <div class="hero-bg"
    th:each="img: ${images.header}"
    th:style="|background-image: url('${img.fileName}')|">
        <p th:text="${img.fileName}"></p>
    </div>
    <div class="hero-top"></div>
    <div class="hero-content">
        <h1 th:text="${heroTitle}">Personazai vaikams</h1>
        <p>Linksma ir isimintina svente jusu maziesiems</p>
    </div>
    <div class="hero-wave"></div>
</header>
<section class="circle-navigation">

        <div id="header-images">
        <div th:each="img: ${images.header}"
             th:style="|background-image: url('${img.fileName}')|"
             class="header-bg"
        ></div>

        </div>
        <button class="circle pink" data-url="/programos">Programa</button>
        <button class="circle blue" data-url="/personazai">Personazai</button>
        <button class="circle purple" data-url="/galerija">Galerija</button>
        <button class="circle red" data-url="/atsiliepimai">Atsiliepimai</button>
        <button class="circle blue" data-url="/kontaktai">Kontaktai</button>
</section>
<section class="about-section">
    <div class="about-wrapper">
        <div class="about-images">
            <img th:each="img: ${images.about}"
            th:src="${img.fileName}"
            class="about-img">
        </div>
        <div class="about-content">
            <h2>Susipazinkime!</h2>
            <p th:text="${aboutText}">
                Esame nedidele, bet labai stipri animatoriu komanda.
            </p>
            <a href="/order" class="order-btn">Pateikti uzsakyma</a>
        </div>

    </div>

</section>
<footer class="footer">
    <div class="content-contacts">
        <button class="fb-contacts"></button>
    </div>
</footer>
