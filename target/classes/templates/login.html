<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisijungimas</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-panel">
        <img src="/images/logo.png" alt="Smaguciai" class="login-logo">
        <h1>Prisijunkite</h1>

        <p class="login-message error" th:if="${param.error}">
            Neteisingas prisijungimo vardas arba slaptažodis
        </p>
        <p class="login-message success" th:if="${param.logout}">
            Atsijungta
        </p>

        <form th:action="@{/login}" method="post" class="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="username">Prisijungimo vardas</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Slaptažodis</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit" class="login-button">Prisijungti</button>
        </form>

    </section>

</main>

</body>
</html>
