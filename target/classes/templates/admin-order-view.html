<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org", charset="UTF-8">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<link rel="stylesheet"th:href="@{/css/admin.css}">
</head>
<body>
<div class="order-container">

    <div id="order-view">
<h1>Užsakymas nr:<span th:text="${order.id}"></span></h1><br>

        <input type="hidden" id="orderId" th:value="${order.id}">
        <div class="field">
            <label>Šventės pradžia:</label>
            <span class="view-mode" th:text="${order.startTime}"></span>
            <input class = "edit-mode" name="startTime" type = "datetime-local" th:value="${order.startTime}">
        </div>
        <div class="field">
            <label>Šventės pabaiga:</label>
            <span class="view-mode" th:text="${order.endTime}"></span>
            <input class = "edit-mode" name="endTime" type = "datetime-local" th:value="${order.endTime}">
        </div>
        <div class="field">
<label>Vaiko vardas:</label>
<span class="view-mode" th:text="${order.childName}"></span>
<input class = "edit-mode" name="childName" type = "text" th:value="${order.childName}">
</div>
        <div class="field">
<label>Vaiko amžius:</label>
<span class="view-mode" th:text="${order.age}"></span>
<input class= "edit-mode" name ="age" type = "text" th:value="${order.age}">
        </div>
        <div class="field">
        <label>Numatomas vaikų skaičius:</label>
        <span class="view-mode" th:text="${order.amountOfChildren}"></span>
        <input class= "edit-mode" name ="amountOfChildren" type = "text" th:value="${order.amountOfChildren}">
    </div>
        <div class="field">
<label>Užsakymo adresas:</label>
<span class="view-mode" th:text="${order.location}"></span>
<input class = "edit-mode" name="location" type = "text" th:value="${order.location}">
        </div>
        <div class="field">
<label>Personažas:</label>
<span class="view-mode" th:text="${order.character}"></span>
    <select class="edit-mode" name="character">
        <option th:each="c:${T(org.smaguciai.enumerators.Characters).values()}"
                th:value ="${c}"
                th:text="${c}"
                th:selected="${c == order.character}">
        </option>
    </select>
        </div>
        <div class="field">
<label>Šventės žanras:</label>
<span class="view-mode" th:text="${order.orderGenre}"></span>
            <select class="edit-mode" name="orderGenre">
                <option th:each="c:${T(org.smaguciai.enumerators.OrderGenre).values()}"
                        th:value ="${c}"
                        th:text="${c}"
                        th:selected="${c == order.orderGenre}">
                </option>
            </select>
        </div>
        <div class="field">
            <label>Kontaktinis numeris:</label>
            <span class="view-mode" th:text="${order.phoneNumber}"></span>
            <input class= "edit-mode" name="phoneNumber" type = "text" th:value="${order.phoneNumber}">
        </div>
        <div class="field">
            <label>Elektroninis paštas:</label>
            <span class="view-mode" th:text="${order.email}"></span>
            <input class= "edit-mode" name="email" type = "text" th:value="${order.email}">
        </div>
        <div class="field">
            <label>Pastabos:</label>
            <span class="view-mode" th:text="${order.notes}"></span>
            <input class= "edit-mode" name="notes" type = "text" th:value="${order.notes}">
        </div>
        <div class="field">
            <label>Vedėjas:</label>
            <span class="view-mode" th:text="${order.performer}"></span>
            <select class="edit-mode" name="performer">
                <option th:each="c:${T(org.smaguciai.enumerators.Performer).values()}"
                        th:value ="${c}"
                        th:text="${c}"
                        th:selected="${c == order.performer}">
                </option>
            </select>
        </div>
        <div class="field">
            <label>Statusas:</label>
            <span class="view-mode" th:text="${order.status}"></span>
            <select class="edit-mode" name="status">
                <option th:each="c:${T(org.smaguciai.enumerators.OrderStatus).values()}"
                        th:value ="${c}"
                        th:text="${c}"
                        th:selected="${c == order.status}">
                </option>
            </select>
        </div>

<a href = "/admin/orders">Grįžti į kalendorių</a>

</div>
<div class="action">
<button id="backButton" class="primary-btn" onclick="window.location.href='/admin/orders'">Grįžti į kalendorių</button>
<button id="editButton" type ="button" class="secondary-btn">Taisyti užsakymą</button>
<button id="deleteButton" type="button" class="danger-btn">Ištrinti užsakymą</button>
</div>
    <div class="edit-actions edit-mode">
        <button id ="save-btn" class="btn-success">Išsaugoti</button>
        <button id ="cancel-btn" class="btn-secondary">Atšaukti</button>
    </div>
</div>
<script th:src="@{/js/order-view-edit.js}" defer></script>


</body>
</html>
