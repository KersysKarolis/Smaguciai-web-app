<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org", charset="UTF-8">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Užsakymas</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <script th:src="@{/js/order-form.js}" defer></script>
  <link rel="stylesheet" th:href="@{/css/components/orderform.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oi&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Oi&display=swap" rel="stylesheet">
</head>

<body class="order-page">
<main class="order-shell">
      <form th:action="@{/order}" th:object="${order}" method="post" class="order-form">
          <div class="form-content">
              <header class="form-header">
                  <a th:href="@{/}" class="back-link">Grįžti</a>
                  <div class="playful-logo" aria-label="Smagučiai">
                      <span style="--c:#f8981c; --y:0em; --r:-4deg;">S</span>
                      <span style="--c:#ea1b64; --y:-0.12em; --r:3deg;">M</span>
                      <span style="--c:#4455a5; --y:0.04em; --r:-2deg;">A</span>
                      <span style="--c:#903e98; --y:-0.11em; --r:4deg;">G</span>
                      <span style="--c:#ee4438; --y:0.07em; --r:-3deg;">U</span>
                      <span style="--c:#f8981c; --y:-0.16em; --r:3deg;">Č</span>
                      <span style="--c:#ea1b64; --y:0em; --r:-2deg;">I</span>
                      <span style="--c:#4455a5; --y:-0.05em; --r:2deg;">A</span>
                      <span style="--c:#ee4438; --y:0.03em; --r:-3deg;">I</span>
                  </div>
                  <p class="brand-subtitle">Personažai vaikams</p>
                  <h1>Šventės rezervacija</h1>
              </header>

              <div th:if="${globalError}" class="error-box">
                  <p th:text="${globalError}"></p>
              </div>

              <section class="form-section">
                  <h2>Laikas ir programa</h2>
                  <div class="form-grid">
                      <div class="form-group">
                          <label for="startTime">Programos pradžia</label>
                          <input type="datetime-local" th:field="*{startTime}" id="startTime">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('startTime')}"
                               th:errors="*{startTime}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="endTime">Programos pabaiga</label>
                          <input type="datetime-local" th:field="*{endTime}" id="endTime">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('endTime')}"
                               th:errors="*{endTime}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="orderGenre">Žanras</label>
                          <select th:field="*{orderGenre}" id="orderGenre">
                              <option value="">Pasirinkti</option>
                              <option th:each="g : ${genres}"
                                      th:value="${g.name()}"
                                      th:text="${g.label}">
                              </option>
                          </select>
                          <div class="field-error"
                               th:if="${#fields.hasErrors('orderGenre')}"
                               th:errors="*{orderGenre}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="character">Personažas</label>
                          <select th:field="*{character}" id="character">
                              <option value="">Pasirinkti</option>
                              <option th:each="c : ${character}"
                                      th:value="${c.name()}"
                                      th:text="${c.label}">
                              </option>
                          </select>
                          <div class="field-error"
                               th:if="${#fields.hasErrors('character')}"
                               th:errors="*{character}">
                          </div>
                      </div>
                  </div>
              </section>

              <section class="form-section">
                  <h2>Šventės informacija</h2>
                  <div class="form-grid">
                      <div class="form-group">
                          <label for="childName">Vaiko vardas</label>
                          <input type="text" th:field="*{childName}" id="childName" autocomplete="given-name">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('childName')}"
                               th:errors="*{childName}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="age">Vaiko amžius</label>
                          <input type="number" th:field="*{age}" id="age" min="1" max="18">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('age')}"
                               th:errors="*{age}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="amountOfChildren">Planuojamas vaikų skaičius</label>
                          <input type="number" th:field="*{amountOfChildren}" id="amountOfChildren" min="1" max="50">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('amountOfChildren')}"
                               th:errors="*{amountOfChildren}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="location">Šventės adresas</label>
                          <input type="text" th:field="*{location}" id="location" placeholder="Miestas, Gatvė 1">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('location')}"
                               th:errors="*{location}">
                          </div>
                      </div>
                  </div>
              </section>

              <section class="form-section">
                  <h2>Kontaktai</h2>
                  <div class="form-grid">
                      <div class="form-group">
                          <label for="phoneNumber">Kontaktinis telefonas</label>
                          <input type="tel" th:field="*{phoneNumber}" id="phoneNumber" autocomplete="tel">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('phoneNumber')}"
                               th:errors="*{phoneNumber}">
                          </div>
                      </div>

                      <div class="form-group">
                          <label for="email">Elektroninis paštas</label>
                          <input type="email" th:field="*{email}" id="email" autocomplete="email">
                          <div class="field-error"
                               th:if="${#fields.hasErrors('email')}"
                               th:errors="*{email}">
                          </div>
                      </div>
                  </div>

                  <div class="form-group">
                      <label for="notes">Pastabos</label>
                      <textarea th:field="*{notes}" id="notes" rows="4"></textarea>
                      <div class="field-error"
                           th:if="${#fields.hasErrors('notes')}"
                           th:errors="*{notes}">
                      </div>
                  </div>
              </section>

              <button type="submit" class="btn-primary">Pateikti užsakymą</button>
          </div>
      </form>
  </main>
</body>
</html>
