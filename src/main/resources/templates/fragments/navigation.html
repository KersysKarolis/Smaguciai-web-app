<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="navigation" >
    <div class="nav-strip">
<div class="circle-container">
        <a th:href="@{#programos}" class="circle pink">Programa</a>
        <a th:href="@{#personage}" class="circle blue">Personazai</a>
        <a th:href="@{#reviews}" class="circle red">Atsiliepimai</a>
        <a th:href="@{#contacts}" class="circle purple">Kontaktai</a>
        <a th:href="@{#request}" class="circle blue">Susisiekime</a>
    </div>
</div>

    <!-- Mobile Navigation -->
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle mobile menu">
        <div class="hamburger">
        </div>
    </button>


    <!-- Mobile Menu Panel -->
    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Meniu</h3>
        </div>
        <nav class="mobile-nav-links">
            <a th:href="@{#programos}" class="mobile-nav-link pink" onclick="toggleMobileMenu()">Programa</a>
            <a th:href="@{#personage}" class="mobile-nav-link blue" onclick="toggleMobileMenu()">Personazai</a>
            <a th:href="@{#atsiliepimai}" class="mobile-nav-link red" onclick="toggleMobileMenu()">Atsiliepimai</a>
            <a th:href="@{/order}" class="mobile-nav-link purple" onclick="toggleMobileMenu()">Prisijunk!</a>
            <a th:href="@{#kontaktai}" class="mobile-nav-link blue" onclick="toggleMobileMenu()">Susisiekime</a>

        </nav>
    </div>

    <div class="overlay" onclick="toggleMobileMenu()"></div>
</div>
</body>
</html>
