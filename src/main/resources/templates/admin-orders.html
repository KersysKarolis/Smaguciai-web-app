<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin – Užsakymai</title>
<link rel="stylesheet" th:href="@{/css/calendar.css}">

</head>
<body class="admin-layout">
<!--HEADER-->
<header class="admin-header">
  <div class="logo">
    <img src="/images/logo.png" class="logo-img"></div>
<div id="pending-container" >
 <!-- <button id="pending-btn" class="notification-btn" data-open="pending">
  🔔
  <span id="pending-count"
        class="badge"
        th:text="${pendingOrderCount}"
        th:if="${pendingOrderCount > 0}"
        >0</span>
  </button> -->
  <button  id="pending-btn" class="notification-btn" data-open="pending">
    🔔
    <span id="pending-count"
          class="badge"
          th:text="${pendingOrderCount}"
          th:if="${pendingOrderCount > 0}"
    >0</span>
  </button>
  <button class="notification-btn"
          data-open="edit-text"
          title="Redaguoti pagrindinio puslapio tekstus">
    ✏️
  </button>

  <button class="notification-btn"
          data-open="edit-images"
          title="Redaguoti pagrindinio puslapio nuotraukas">
    🖼️
  </button>
</div>
</header>

<!--MAIN-->
<main class="admin-main">
  <section class="calendar-container">
<h1>Užsakymai (Admin)</h1>

<div id="calendar" class="calendar-item"></div>
  </section>
</main >
<!-- MODAL -->
<!--<div id="pending-modal" class="modal hidden" >

  <div class="modal-content">
    <h3>Naujos užklausos</h3>
    <ul id="pending-list"></ul>
    <button id="close-pending">Uždaryti</button>
  </div>
</div>-->
<div class="modal hidden" data-modal="pending" >

  <div class="modal-content">
    <button data-close>&times;</button>
    <h3>Naujos užklausos</h3>
    <ul id="pending-list"></ul>

  </div>
</div>
<div class="modal hidden" data-modal="edit-text">
  <div class="modal-content">
  <button data-close type="button">&times;</button>
    <h3 id="content-modal-title">✏️ Redaguoti teksta</h3>
    <label for="content-select">Pasirinkite redaguojama teksta:</label>
    <select id="content-select"></select>
    <textarea id="content-textarea" rows="6" placeholder="Iveskite teksta.."></textarea>
    <button id="save-text-btn" type="button">💾 Issaugoti</button>
  </div>

</div>
<div class="modal hidden" data-modal="edit-images">
  <div class="modal-content">
    <button data-close type="button">&times;</button>
    <h3>🖼️Nuotrauku keitimas </h3>
    <label>Kuri nuotrauka?</label>
    <select id="image-select"></select>
    <input type="file" id="image-upload" multiple>
    <div>
      <h3>Ikeliama nuotrauka</h3>
    <div id ="image-preview" class="image-preview"></div>
    </div>
    <div>
      <h3>Esama nuotrauka</h3>
      <img id="current-image-preview" style="max-width:150px;">
      <p id="no-image-text" style="display:none">Nuotrauka neikelta</p>
    </div>
    <button id="save-img-btn" type="button">💾 Issaugoti</button>
    <button id="delete-img-btn" type="button">🗑️ Istrinti</button>
  </div>



</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script th:inline="javascript">
  window.initialPendingCount = /*[[${pendingOrderCount}]]*/ 0;
  window.initialPendingOrders = /*[[${pendingOrders}]]*/ [];
  window.initialOrders = /*[[${orders}]]*/ [];
</script>
<script th:src="@{/js/modal-manager.js}" defer></script>
<script th:src="@{/js/admin-orders.js}" defer></script>
<script th:src="@{/js/admin-home-editor.js}" defer></script>



</body>
</html>
